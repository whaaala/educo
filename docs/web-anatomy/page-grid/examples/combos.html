<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page grid combinations</title>
<!--
  PAGE GRID · RULE MAP step 3: "everything follows whatever number of columns and rows you set, automatically, per
  breakpoint" (the user, 2026-10-03). ?cols=<desktop count>&phone=<phone count, default half>&row=<row step in rem>&guides=1
  Blocks are stored as SHARES of the page ([start, end] in 0..1), never as column numbers; the engine below derives every
  start / span for the count in force at the current rung, then applies the content minimum (a block whose longest word
  needs more room takes more columns; a row that no longer fits wraps). Proven by scripts/research/page-grid-combos.js.
-->
<style>
  :root { --box-u: clamp(0.4375rem, calc(0.3125rem + 0.5cqw), 0.875rem); --gut: calc(var(--box-u) * 3.2); --gap: 0px; --space: calc(var(--box-u) * 1.6); --row: 1.5rem; --guide: oklch(0.6 0.2 25); }
  * { box-sizing: border-box; }
  body { position: relative; container-type: inline-size; margin: 0; font: 1rem/1.6 system-ui, sans-serif; color: oklch(0.25 0.02 260); background: oklch(0.985 0.005 260); }
  :root { --gut: max(calc(var(--box-u) * 3.2), (100cqi - 80rem) / 2); }
  .band { display: grid; grid-template-columns: var(--page-cols); row-gap: var(--space); padding-block: 2rem; }
  .band > * { margin-inline: calc(var(--space) / 2); } .band > .bleed { margin-inline-start: 0; }
  .band:nth-child(even) { background: oklch(0.93 0.03 250); }
  .cell { background: oklch(1 0 0); border: 1px solid oklch(0.85 0.01 260); padding: 0.75rem; min-inline-size: 0; overflow-wrap: break-word; }
  .pic { aspect-ratio: 4 / 3; background: linear-gradient(135deg, oklch(0.7 0.1 200), oklch(0.5 0.12 260)); }
  .bleed { aspect-ratio: auto; min-block-size: 6rem; }
  .guides { position: absolute; inset: 0 0 auto 0; block-size: var(--doc-h, 100%); display: grid; grid-template-columns: var(--page-cols); pointer-events: none; z-index: 5;
    background-image: repeating-linear-gradient(to bottom, color-mix(in oklch, var(--guide) 30%, transparent) 0 1px, transparent 1px var(--row)); }
  .guides span { grid-row: 1; background: color-mix(in oklch, var(--guide) 10%, transparent); border-inline: 1px solid var(--guide); }
  html:not(.show-guides) .guides { display: none; }
</style>
</head>
<body>
<div class="guides" id="guides" aria-hidden="true"></div>
<main id="main"></main>
<script>
  const q = new URLSearchParams(location.search);
  const DESK = +(q.get('cols') || 12), PHONE = +(q.get('phone') || Math.max(2, Math.round(DESK / 2))), ROW = +(q.get('row') || 1.5);
  document.documentElement.style.setProperty('--row', ROW + 'rem');
  if (q.get('guides')) document.documentElement.classList.add('show-guides');
  // the template for N columns: margins as named tracks, each column [c] col [m] col [ce], the gutter its own track;
  // two line-name groups never touch (ledger #21)
  const tpl = (n) => `[full-start] minmax(calc(var(--gut) - var(--space) / 2), 1fr) [content-start c] minmax(0,1fr) [m] minmax(0,1fr) [ce]`
    + (n > 1 ? ` repeat(${n - 1}, var(--gap) [c] minmax(0,1fr) [m] minmax(0,1fr) [ce])` : '') + ` [content-end] minmax(calc(var(--gut) - var(--space) / 2), 1fr) [full-end]`;
  // THE PAGE: bands of blocks, each block a SHARE [start, end] of the content (the stored model)
  const B = (cls, txt, a, b, extra = {}) => ({ cls, txt, a, b, ...extra });
  const PAGE = [
    [B('cell', 'Words beside a picture', 0, 1 / 2), B('pic', '', 1 / 2, 1)],
    [B('cell', 'Admissions', 0, 1 / 3), B('cell', 'Curriculum', 1 / 3, 2 / 3), B('cell', 'Sports', 2 / 3, 1)],
    [B('cell', 'Term dates', 0, 1 / 4), B('cell', 'Fees', 1 / 4, 1 / 2), B('cell', 'Uniform', 1 / 2, 3 / 4), B('cell', 'Clubs', 3 / 4, 1)],
    [B('cell', 'News', 0, 1 / 3), B('cell', 'The latest from the school this week, with sports results.', 1 / 3, 1)],
    [B('pic', '', 0, 5 / 12), B('cell', 'A picture beside words, the words taking seven twelfths.', 5 / 12, 1)],
    [B('cell', 'Contents', 0, 1 / 3), B('cell', 'The body leaves an empty column before it on purpose.', 5 / 12, 1)],
    [B('cell', 'Centred two thirds of the page.', 1 / 6, 5 / 6)],
    [B('pic bleed', '', 'full', 1 / 2), B('cell', 'Half-bleed: the picture runs to the window edge.', 1 / 2, 1)],
    [B('cell', '98%', 0, 1 / 3, { keep: true }), B('cell', '1,200', 1 / 3, 2 / 3, { keep: true }), B('cell', '35', 2 / 3, 1, { keep: true })],
    [B('pic', '', 0, 1 / 2, { rows: 2 }), B('cell', 'Wide', 1 / 2, 1), B('cell', 'Small', 1 / 2, 3 / 4), B('cell', 'Small', 3 / 4, 1)],
  ];
  const main = document.getElementById('main');
  for (const [i, blocks] of PAGE.entries()) {
    const band = document.createElement('section'); band.className = 'band'; band.dataset.band = i;
    for (const b of blocks) { const e = document.createElement('div'); e.className = b.cls; e.textContent = b.txt; e.dataset.a = b.a; e.dataset.b = b.b; if (b.keep) e.dataset.keep = 1; if (b.rows) e.dataset.rows = b.rows; band.append(e); }
    main.append(band);
  }
  const g = document.getElementById('guides');
  // THE ENGINE: count for the rung → every start / span from its share → the content minimum → wrap
  const layout = () => {
    const phone = innerWidth < 600, n = phone ? PHONE : DESK;
    document.documentElement.style.setProperty('--page-cols', tpl(n)); document.documentElement.dataset.cols = n;
    g.innerHTML = ''; for (let i = 1; i <= n; i++) { const s = document.createElement('span'); s.style.gridColumn = `c ${i} / ce ${i}`; g.append(s); }
    for (const band of main.children) {
      const kids = [...band.children]; const t = getComputedStyle(band).gridTemplateColumns.replace(/\[[^\]]*\]/g, ' ').trim().split(/\s+/).map(parseFloat);
      const col = t[1] + t[2], gap = n > 1 ? t[3] : 0;
      const need = (e) => { if (!e.textContent.trim()) return 0; let w = 0; for (const word of e.textContent.match(/\S+/g)) { const s = document.createElement('span'); s.textContent = word; s.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap'; e.append(s); w = Math.max(w, s.getBoundingClientRect().width); s.remove(); } return w + 1.5 * parseFloat(getComputedStyle(document.documentElement).fontSize) + 2 * parseFloat(getComputedStyle(e).marginInlineStart) + 2; };
      const minSpan = (e) => Math.min(n, Math.max(1, Math.ceil((need(e) + gap) / (col + gap))));
      let stackAll = phone && !kids.every(e => e.dataset.keep);
      // A ROW THAT CANNOT KEEP ITS SHARES RE-SPLITS AS A WHOLE (ledger #28 — wrapping block by block left staircases and a
      // lone block shifted off its share): fewer, EQUAL columns — k across for the largest k where every block's words
      // fit — never one block pushing the next along. A band with a row-spanning block (a bento) stacks instead.
      if (!stackAll) {
        const want = kids.map(e => { const s = e.dataset.a === 'full' ? 1 : Math.round(+e.dataset.a * n) + 1; return Math.max(s, Math.round(+e.dataset.b * n)) - s + 1; });
        const keeps = kids.every((e, i) => e.dataset.a === 'full' || minSpan(e) <= want[i]);
        if (!keeps) {
          if (kids.some(e => e.dataset.rows)) stackAll = true;
          else {
            let k = kids.length; while (k > 1 && !kids.every(e => minSpan(e) <= Math.floor(n / k))) k--;
            const span = Math.floor(n / k);
            kids.forEach((e, i) => { const s = (i % k) * span + 1; e.style.gridColumn = k === 1 ? `c 1 / ce ${n}` : `c ${s} / ce ${s + span - 1}`; e.style.gridRow = `${1 + Math.floor(i / k)}`; e.dataset.c0 = k === 1 ? 1 : s; e.dataset.c1 = k === 1 ? n : s + span - 1; e.dataset.row = 1 + Math.floor(i / k); });
            band.dataset.resplit = k; continue;
          }
        }
      }
      delete band.dataset.resplit;
      // placement: an occupancy grid — each block wants the columns its share gives (widened to its words), takes the
      // first free place at or after its own start in the current row, else the next row; a row-spanning block marks
      // every row it covers
      const used = new Set(); const free = (r, s, en) => { for (let c = s; c <= en; c++) if (used.has(r + ':' + c)) return false; return true; };
      let row = 1, cursor = 1;
      for (const e of kids) {
        if (stackAll) { e.style.gridColumn = `c 1 / ce ${n}`; e.style.gridRow = 'auto'; e.dataset.c0 = 1; e.dataset.c1 = n; continue; }
        const bleed = e.dataset.a === 'full';
        const s0 = bleed ? 1 : Math.round(+e.dataset.a * n) + 1, e0 = Math.max(s0, Math.round(+e.dataset.b * n));
        const span = Math.min(n, Math.max(e0 - s0 + 1, bleed ? 1 : minSpan(e))), rows = +(e.dataset.rows || 1);
        let s = Math.max(s0, cursor);
        for (;;) {
          if (s + span - 1 > n) { row++; s = s0 + span - 1 <= n ? s0 : 1; continue; }
          let ok = true; for (let r = row; r < row + rows; r++) if (!free(r, s, s + span - 1)) ok = false;
          if (ok) break; s++;
        }
        for (let r = row; r < row + rows; r++) for (let c = s; c < s + span; c++) used.add(r + ':' + c);
        e.style.gridColumn = bleed ? `full-start / ce ${s + span - 1}` : `c ${s} / ce ${s + span - 1}`;
        e.style.gridRow = rows > 1 ? `${row} / span ${rows}` : `${row}`;
        e.dataset.c0 = bleed ? 0 : s; e.dataset.c1 = s + span - 1; e.dataset.row = row; cursor = s + span;
        if (cursor > n) { row++; cursor = 1; }
      }
    }
    document.documentElement.style.setProperty('--doc-h', (main.offsetTop + main.offsetHeight) + 'px');
  };
  layout(); addEventListener('resize', layout); new ResizeObserver(() => document.documentElement.style.setProperty('--doc-h', (main.offsetTop + main.offsetHeight) + 'px')).observe(main);
</script>
</body>
</html>
